backend:
  name: git-gateway
  branch: master

media_folder: static/img
public_folder: /img

collections:
  - label: 'Page'
    name: 'page'
    folder: 'content/page'
    create: true
    media_folder: ''
    public_folder: ''
    path: '{{slug}}/{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Header title', name: 'title', widget: 'string' }
      - { label: 'School or department content reviewed (hides Not reviewed banner)', name: 'reviewed', widget: 'boolean', default: false, required: false }
      - { label: 'Header blurb', name: 'blurb', widget: 'markdown', required: false }
      - { label: 'Publish date', name: 'date', widget: 'datetime' }
      - { label: 'Featured image', name: 'image', widget: 'image', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }

  # Calendar events are maintained in content/calendar/events.csv.

  # FAQ content lives in the admissions-faq Page body, alongside its metadata.

  - label: 'Testimonials'
    name: 'testimonials'
    files:
      - label: 'Parent testimonials'
        name: 'parent-testimonials'
        file: 'content/parent-testimonials.yml'
        fields:
          - label: 'Entries'
            name: 'entries'
            widget: 'list'
            label_singular: 'entry'
            summary: '{{fields.author}}'
            fields:
              - label: 'Stars'
                name: 'stars'
                widget: 'select'
                default: '5'
                options: ['1', '2', '3', '4', '5']
              - { label: 'Date', name: 'date', widget: 'datetime' }
              - { label: 'Author', name: 'author', widget: 'string' }
              - { label: 'Post', name: 'post', widget: 'text' }  
      - label: 'Student testimonials'
        name: 'student-testimonials'
        file: 'content/student-testimonials.yml'
        fields:
          - label: 'Entries'
            name: 'entries'
            widget: 'list'
            label_singular: 'entry'
            summary: '{{fields.author}}'
            fields:
              - label: 'Stars'
                name: 'stars'
                widget: 'select'
                default: '5'
                options: ['1', '2', '3', '4', '5']
              - { label: 'Date', name: 'date', widget: 'datetime' }
              - { label: 'Image', name: 'avatar', widget: 'image', required: false }
              - { label: 'Author', name: 'author', widget: 'string' }
              - { label: 'Caption', name: 'caption', widget: 'string' }
              - { label: 'Post', name: 'post', widget: 'text' }  

  - label: 'Config'
    name: 'config'
    files: 
      - label: 'Navigation'
        name: 'navigation'
        file: 'content/navigation.yml'
        fields:
          - label: 'Main'
            name: 'main'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Url', name: 'url', widget: 'string' }
              - label: 'Subnav'
                name: 'subnav'
                widget: 'list'
                fields:
                  - { label: 'Title', name: 'title', widget: 'string' }
                  - { label: 'Url', name: 'url', widget: 'string' }
                  - { label: 'Department group', name: 'group', widget: 'select', options: ['Science', 'Humanities', 'Enrichment'], required: false }
          - label: 'Footer'
            name: 'footer'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Url', name: 'url', widget: 'string' }
      - label: 'Teachers'
        name: 'teachers'
        file: 'content/teachers.json'
        fields:
          - { label: 'Show fictional profile label', name: 'placeholder', widget: 'boolean', default: true }
          - label: 'Profiles'
            name: 'profiles'
            widget: 'list'
            summary: '{{fields.name}}'
            fields:
              - { label: 'ID', name: 'id', widget: 'string' }
              - { label: 'Name', name: 'name', widget: 'string' }
              - { label: 'Portrait', name: 'portrait', widget: 'image' }
              - { label: 'Teaching focus', name: 'focus', widget: 'string' }
              - label: 'Highlight'
                name: 'highlight'
                widget: 'object'
                fields:
                  - { label: 'Title', name: 'title', widget: 'string' }
                  - { label: 'Excerpt', name: 'excerpt', widget: 'text' }
                  - label: 'Article paragraphs'
                    name: 'paragraphs'
                    widget: 'list'
                    field: { label: 'Paragraph', name: 'paragraph', widget: 'text' }
      - label: 'Head'
        name: 'head'
        file: 'content/head.yml'
        editor:
          preview: false
        fields:
          - { label: 'Arbitrary HTML', name: 'post', widget: 'text', required: false }
